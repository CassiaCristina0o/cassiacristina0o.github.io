<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Análise do cartão corporativo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>html,body,.stApp,.stlite-root{background:#011E16 !important;color:#A8B5AC}.Toastify__toast{background:#013026 !important;color:#EDE6DA !important;border:1px solid rgba(201,164,92,0.22)}.Toastify__toast *{color:#EDE6DA !important}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["xlsxwriter"],
          entrypoint: "streamlit_app.py",
          streamlitConfig: {
            "theme.base": "dark",
            "theme.primaryColor": "#6E1A1F",
            "theme.backgroundColor": "#011E16",
            "theme.secondaryBackgroundColor": "#013026",
            "theme.textColor": "#EDE6DA",
            "theme.font": "sans serif",
            "client.toolbarMode": "viewer",
          },
          files: {
            "streamlit_app.py": { url: "./streamlit_app.py" },
            "modo_embutido.txt": "1",
            "config.py": { url: "./codigo/config.py" },
            "registro.py": { url: "./codigo/registro.py" },
            "banco.py": { url: "./codigo/banco.py" },
            "leitura.py": { url: "./codigo/leitura.py" },
            "categorias.py": { url: "./codigo/categorias.py" },
            "relatorio.py": { url: "./codigo/relatorio.py" },
            "demo/202606_CPGF.zip": { url: "./demo/202606_CPGF.zip" },
            "demo/202607_CPGF.zip": { url: "./demo/202607_CPGF.zip" },
            "demo/202608_CPGF.zip": { url: "./demo/202608_CPGF.zip" },
            "demo/unidades_gestoras.csv": { url: "./demo/unidades_gestoras.csv" },
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
